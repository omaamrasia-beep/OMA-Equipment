<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance Dashboard - PEA C1</title>
    <!--
      Self-hosted vendor libraries (ดูขั้นตอนดาวน์โหลด/build ที่ vendor/README_DOWNLOAD_VENDOR_FILES.md
      และ tailwind-build/README.md) — เดิมโหลดจาก CDN สาธารณะ (cdn.tailwindcss.com, jsdelivr,
      unpkg, cdnjs) ซึ่งบางเครือข่ายองค์กร (เช่น PEA) บล็อกโดเมนพวกนี้ ทำให้หน้าเว็บช้า/พังเวลาเปิดจากใน
      เครือข่ายนั้น เปลี่ยนมาเสิร์ฟจาก origin เดียวกับตัวเว็บเอง เหลือ external request จุดเดียวคือเรียก
      Apps Script Web App ตอนดึงข้อมูลเท่านั้น
    -->
    <link rel="stylesheet" href="./vendor/tailwind.css">
    <script src="./vendor/chart.umd.min.js"></script>
    <script src="./vendor/vue.global.prod.js"></script>
    <script src="./vendor/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="./vendor/fontawesome/css/all.min.css">
</head>
<body class="bg-slate-100 font-sans text-slate-800">

    <div id="app" class="min-h-screen flex flex-col">

        <!-- ==================== LOGIN SCREEN ==================== -->
        <div v-if="!session" class="min-h-screen flex items-center justify-center bg-purple-900 p-4">
            <div class="bg-white rounded-xl shadow-xl w-full max-w-sm p-6">
                <div class="text-center mb-6">
                    <i class="fa-solid fa-tower-cell text-3xl text-purple-700"></i>
                    <h1 class="font-bold text-slate-800 mt-2">Maintenance Dashboard</h1>
                    <p class="text-xs text-slate-500">กฟภ. ภาคกลาง เขต 1 (กฟก.1)</p>
                </div>
                <div class="space-y-3">
                    <div>
                        <label class="text-xs font-bold text-slate-500">ชื่อผู้ใช้งาน</label>
                        <input v-model="loginForm.username" @keyup.enter="submitLogin" type="text" class="w-full text-sm border border-slate-300 rounded-lg p-2 mt-1 focus:outline-none focus:border-purple-500">
                    </div>
                    <div>
                        <label class="text-xs font-bold text-slate-500">รหัสผ่าน</label>
                        <input v-model="loginForm.password" @keyup.enter="submitLogin" type="password" class="w-full text-sm border border-slate-300 rounded-lg p-2 mt-1 focus:outline-none focus:border-purple-500">
                    </div>
                    <p v-if="loginForm.error" class="text-xs text-red-600">{{ loginForm.error }}</p>
                    <button @click="submitLogin" :disabled="loginForm.loading" class="w-full bg-purple-700 hover:bg-purple-800 disabled:opacity-50 text-white text-sm font-medium py-2.5 rounded-lg transition">
                        {{ loginForm.loading ? 'กำลังเข้าสู่ระบบ...' : 'เข้าสู่ระบบ' }}
                    </button>
                </div>
            </div>
        </div>

        <!-- ==================== MAIN DASHBOARD ==================== -->
        <template v-else>
        <header class="bg-purple-900 text-white shadow-lg sticky top-0 z-50">
            <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center flex-wrap gap-2">
                <div class="flex items-center space-x-3">
                    <i class="fa-solid font-bold text-2xl fa-tower-cell text-amber-400"></i>
                    <div>
                        <h1 class="text-lg font-bold leading-tight">ระบบติดตามงานซ่อมบำรุงวิทยุสื่อสาร</h1>
                        <p class="text-xs text-purple-200">กฟภ. ภาคกลาง เขต 1 (กฟก.1)</p>
                    </div>
                </div>
                <div class="flex items-center space-x-3 text-sm bg-purple-800 px-3 py-1.5 rounded-lg">
                    <i class="fa-solid fa-user-circle text-lg"></i>
                    <div>
                        <span class="font-semibold block leading-none">{{ session.displayName }}</span>
                        <span class="text-[10px] text-amber-300 uppercase">{{ roleLabel(session.role) }}</span>
                    </div>
                    <button @click="doLogout" title="ออกจากระบบ" class="text-purple-200 hover:text-white ml-1">
                        <i class="fa-solid fa-right-from-bracket"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- ==================== NAV TABS ==================== -->
        <nav class="bg-white border-b border-slate-200 sticky top-[57px] z-40">
            <div class="max-w-7xl mx-auto px-4 flex gap-1">
                <button @click="currentView = 'dashboard'"
                        :class="currentView === 'dashboard' ? 'border-purple-600 text-purple-700' : 'border-transparent text-slate-500 hover:text-slate-700'"
                        class="px-4 py-3 text-sm font-medium border-b-2 transition flex items-center">
                    <i class="fa-solid fa-gauge mr-1.5"></i> แดชบอร์ด
                </button>
                <button v-if="session.role === 'admin'" @click="currentView = 'users'"
                        :class="currentView === 'users' ? 'border-purple-600 text-purple-700' : 'border-transparent text-slate-500 hover:text-slate-700'"
                        class="px-4 py-3 text-sm font-medium border-b-2 transition flex items-center">
                    <i class="fa-solid fa-users-gear mr-1.5"></i> จัดการผู้ใช้งาน
                </button>
            </div>
        </nav>

        <main class="flex-1 max-w-7xl w-full mx-auto p-4 space-y-6">

            <!-- CONNECTION ERROR BANNER -->
            <div v-if="apiError" class="bg-red-50 border border-red-200 text-red-700 text-sm p-3 rounded-lg flex items-center">
                <i class="fa-solid fa-triangle-exclamation mr-2"></i>
                {{ apiError }}
            </div>

            <!-- ==================== DASHBOARD VIEW ==================== -->
            <template v-if="currentView === 'dashboard'">

            <!-- INITIAL LOAD: nothing for the first 1s (avoids a needless flash on a fast load), then a spinner if it's genuinely slow -->
            <div v-if="initialLoading">
                <div v-if="showInitialLoader" class="py-24 flex flex-col items-center justify-center text-slate-400">
                    <i class="fa-solid fa-spinner fa-spin text-3xl text-purple-500 mb-3"></i>
                    <p class="text-sm">กำลังโหลดข้อมูลแดชบอร์ด...</p>
                </div>
            </div>
            <template v-else>

            <!-- SLA OVERDUE BANNER -->
            <div v-if="overdueCmCount > 0" class="bg-red-600 text-white text-sm font-bold p-3 rounded-lg">
                มีงาน CM เกิน SLA อยู่ {{ overdueCmCount }} รายการ — กรุณาตรวจสอบด่วน
            </div>

            <!-- IMPORT / HISTORY TOOLBAR -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-wrap items-center gap-3 justify-between">
                <div class="flex items-center gap-2">
                    <label class="text-xs font-bold text-slate-500 uppercase">รอบข้อมูล</label>
                    <select v-model="currentImportId" @change="onSelectImportRound" class="text-sm border border-slate-300 rounded-lg p-2 focus:outline-none focus:border-purple-500 min-w-[220px]">
                        <option v-for="h in importHistory" :key="h.importId" :value="h.importId">
                            {{ formatMonthYearThai(h.dataDate) }}
                        </option>
                    </select>
                    <button @click="showTrend = !showTrend" class="text-xs px-3 py-2 rounded-lg border border-slate-300 hover:bg-slate-50 font-medium">
                        <i class="fa-solid fa-chart-line mr-1"></i> {{ showTrend ? 'ซ่อนแนวโน้ม' : 'ดูแนวโน้มย้อนหลัง' }}
                    </button>
                    <a v-if="selectedImportExcelUrl" :href="selectedImportExcelUrl" target="_blank" class="text-xs px-3 py-2 rounded-lg border border-slate-300 hover:bg-slate-50 font-medium text-slate-600">
                        <i class="fa-solid fa-file-excel mr-1 text-emerald-600"></i> ไฟล์ Excel ต้นฉบับของรอบนี้
                    </a>
                </div>
                <div v-if="session.role === 'admin'" class="flex items-center gap-2">
                    <input ref="fileInput" type="file" accept=".xlsx,.xls" class="hidden" @change="handleFileChange">
                    <button @click="$refs.fileInput.click()" :disabled="importing"
                            class="bg-purple-600 hover:bg-purple-700 disabled:opacity-50 text-white text-xs px-3 py-2 rounded-lg font-medium transition flex items-center">
                        <i class="fa-solid" :class="importing ? 'fa-spinner fa-spin' : 'fa-file-import'"></i>
                        <span class="ml-1">{{ importing ? 'กำลังนำเข้า...' : 'นำเข้าข้อมูล Excel' }}</span>
                    </button>
                </div>
            </div>

            <!-- TREND (ย้อนหลังเทียบหลายรอบ) -->
            <div v-if="showTrend" class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                <h2 class="text-sm font-bold text-slate-700 mb-4 flex items-center">
                    <i class="fa-solid fa-chart-line mr-2 text-purple-600"></i> แนวโน้มเทียบแต่ละรอบข้อมูล
                </h2>
                <div class="relative h-56">
                    <canvas id="trendChart"></canvas>
                </div>
            </div>

            <!-- KPI SUMMARY CARDS: 1 การ์ดต่อประเภทอุปกรณ์ (BTS/DPC/MSO/...) จำนวนคอลัมน์เท่าจำนวนประเภทที่เจอจริง เพื่อให้อยู่แถวเดียวกันพอดีเสมอ -->
            <div class="grid gap-4 grid-cols-[repeat(auto-fit,minmax(160px,1fr))]">
                <div v-for="site in dashboard.sitesSummary" :key="site.type" class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 hover:shadow-md transition">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-xs font-bold text-slate-500 uppercase">{{ site.type }}</span>
                        <i class="fa-solid text-purple-600 text-lg" :class="'fa-' + (site.icon || 'microchip')"></i>
                    </div>
                    <div class="text-2xl font-extrabold text-slate-800">{{ site.count }} <span class="text-xs font-normal text-slate-500">{{ site.unit }}</span></div>
                    <p class="text-[11px] text-emerald-600 mt-1"><i class="fa-solid fa-check-circle"></i> พร้อมใช้งานปกติ</p>
                </div>
                <div v-if="dashboard.sitesSummary.length === 0" class="col-span-full text-center text-sm text-slate-400 py-6">
                    ยังไม่มีข้อมูล — นำเข้าไฟล์ Excel เพื่อเริ่มต้น
                </div>
            </div>

            <!-- CHARTS -->
            <div v-if="chartsError" class="bg-red-50 border border-red-200 text-red-700 text-xs rounded-lg p-3">
                <i class="fa-solid fa-triangle-exclamation mr-1.5"></i> วาดกราฟไม่สำเร็จ: {{ chartsError }}
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                    <div class="flex items-center justify-between mb-1">
                        <h2 class="text-sm font-bold text-slate-700 flex items-center">
                            <i class="fa-solid fa-chart-pie mr-2 text-purple-600"></i> สัดส่วนสถานะงานทั้งหมด (PM / CM)
                        </h2>
                        <button v-if="donutFilter !== 'all'" @click="resetDonut" class="text-[11px] text-purple-600 hover:underline">&larr; ดูทั้งหมด</button>
                    </div>
                    <div class="relative h-64">
                        <canvas id="overallChart"></canvas>
                    </div>
                    <!-- legend เขียนเอง (ไม่ใช้ของ built-in ของ Chart.js) เพื่อให้ตอนกดปิดรายการ สีกับตัวอักษรจางลงแทนการขีดฆ่า -->
                    <div id="overallChartLegend" class="flex flex-wrap gap-x-4 gap-y-1.5 justify-center mt-3"></div>
                    <div v-if="!donutHasData" class="text-center text-sm text-slate-400 py-4">ไม่มีข้อมูลงาน PM/CM สำหรับรอบนี้ (ถ้ามั่นใจว่ามีข้อมูล ให้ตรวจหัวคอลัมน์ชีท CMTickets)</div>
                </div>
                <div class="md:col-span-2 bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                    <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
                        <h2 class="text-sm font-bold text-slate-700 flex items-center">
                            <i class="fa-solid fa-chart-column mr-2 text-purple-600"></i> สถิติอุปกรณ์และสถานะงานแยกตามจังหวัด
                        </h2>
                        <div class="flex flex-wrap gap-2">
                            <select v-model="provinceFilter" class="text-xs border border-slate-300 rounded-lg p-1.5 focus:outline-none">
                                <option value="">ทุกจังหวัด</option>
                                <option v-for="p in provinceOptions" :key="p" :value="p">{{ p }}</option>
                            </select>
                            <select v-model="siteFilter" :disabled="!provinceFilter" class="text-xs border border-slate-300 rounded-lg p-1.5 focus:outline-none disabled:opacity-50 disabled:bg-slate-50">
                                <option value="">ทุกสถานที่</option>
                                <option v-for="s in siteOptionsForProvince" :key="s" :value="s">{{ s }}</option>
                            </select>
                            <div class="flex text-xs border border-slate-300 rounded-lg overflow-hidden">
                                <button @click="provinceViewMetric = 'cm'" :class="provinceViewMetric === 'cm' ? 'bg-purple-600 text-white' : 'bg-white text-slate-600 hover:bg-slate-50'" class="px-3 py-1.5 font-medium transition">CM</button>
                                <button @click="provinceViewMetric = 'pm'" :class="provinceViewMetric === 'pm' ? 'bg-purple-600 text-white' : 'bg-white text-slate-600 hover:bg-slate-50'" class="px-3 py-1.5 font-medium transition border-l border-slate-300">PM</button>
                            </div>
                        </div>
                    </div>
                    <div class="relative h-64">
                        <canvas id="siteChart"></canvas>
                    </div>
                    <div v-if="provinceStats.bySite.length === 0" class="text-center text-sm text-slate-400 py-4">ไม่มีข้อมูลจังหวัด/สถานที่สำหรับรอบนี้ (มีเฉพาะรอบที่นำเข้าจากไฟล์รายงาน ReportWorkOrderStatus)</div>
                </div>
            </div>

            <!-- CM WORK ORDERS -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="p-4 border-b border-slate-100 bg-slate-50">
                    <div class="flex flex-wrap justify-between items-start gap-3">
                        <div>
                            <h2 class="font-bold text-slate-800 flex items-center">
                                รายการแจ้งซ่อม CM (Corrective Maintenance)
                            </h2>
                        </div>
                        <div class="flex gap-2">
                            <button v-if="session.role === 'admin'" @click="openAddCmModal" class="text-xs px-3 py-1.5 rounded-lg bg-purple-600 hover:bg-purple-700 text-white font-medium">
                                <i class="fa-solid fa-plus mr-1"></i> เพิ่มรายการ
                            </button>
                            <a v-if="session.role === 'admin' && sheetLinks && sheetLinks.cmTickets" :href="sheetLinks.cmTickets" target="_blank" rel="noopener"
                               title="เปิดชีท CMTickets ใน Google Sheet" class="text-xs px-3 py-1.5 rounded-lg border border-slate-300 hover:bg-slate-50 text-slate-600 font-medium inline-flex items-center">
                                <i class="fa-solid fa-table-cells mr-1.5 text-emerald-600"></i> เปิด Google Sheet
                            </a>
                            <select v-model="cmStatusFilter" class="text-xs border border-slate-300 rounded-lg p-1.5 focus:outline-none">
                                <option value="">ทุกสถานะ</option>
                                <option value="เกิน SLA">เกิน SLA</option>
                                <option value="รอดำเนินการ">รอดำเนินการ</option>
                                <option value="รออนุมัติ">รออนุมัติ</option>
                                <option value="กำลังดำเนินการ">กำลังดำเนินการ</option>
                                <option value="งาน PM">งาน PM</option>
                                <option value="เสร็จสิ้น">เสร็จสิ้น</option>
                            </select>
                            <select v-model="cmProvinceFilter" class="text-xs border border-slate-300 rounded-lg p-1.5 focus:outline-none">
                                <option value="">ทุกจังหวัด</option>
                                <option v-for="p in cmProvinceOptions" :key="p" :value="p">{{ p }}</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse text-sm">
                        <thead>
                            <tr class="bg-slate-100 text-slate-600 text-xs uppercase border-b">
                                <th class="p-3">Ticket ID</th>
                                <th class="p-3">สถานที่ติดตั้งอุปกรณ์</th>
                                <th class="p-3">อุปกรณ์ที่ขัดข้อง</th>
                                <th class="p-3">เวลาที่รับแจ้ง</th>
                                <th class="p-3">SLA คงเหลือ</th>
                                <th class="p-3">สถานะ</th>
                                <th v-if="session.role === 'admin'" class="p-3 text-center w-10"></th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100">
                            <tr v-for="item in sortedCmTickets" :key="item.ticketId" class="hover:bg-slate-50">
                                <td class="p-3 font-mono font-bold text-purple-700">
                                    <button @click="openTicketDetail(item)" class="underline decoration-dotted hover:text-purple-900">{{ item.ticketId }}</button>
                                </td>
                                <td class="p-3"><span class="font-semibold block">{{ friendlySiteName(item.site) }}</span><span class="text-xs text-slate-400">{{ item.province || '-' }}</span></td>
                                <td class="p-3"><span class="bg-slate-100 text-slate-700 text-xs px-2 py-0.5 rounded border border-slate-200">{{ item.system || '-' }}</span></td>
                                <td class="p-3 text-xs text-slate-500">{{ item.reportedAt ? formatDateTime(item.reportedAt) : '-' }}</td>
                                <td class="p-3">
                                    <span v-if="item.slaDeadline || item.status === 'เสร็จสิ้น'" :class="getSlaBadgeClass(item)" class="px-2.5 py-1 rounded-full text-xs font-bold inline-flex items-center">
                                        <i class="fa-regular fa-clock mr-1"></i> {{ formatSlaTime(item) }}
                                    </span>
                                    <span v-else class="text-slate-400 text-xs">-</span>
                                </td>
                                <td class="p-3">
                                    <select v-if="session.role === 'admin'" v-model="item.status" @change="updateStatus(item)"
                                            :class="getStatusBadgeClass(displayStatus(item))" class="text-xs px-2 py-1 rounded font-medium border-0 focus:outline-none">
                                        <option value="รอดำเนินการ">รอดำเนินการ</option>
                                        <option value="รออนุมัติ">รออนุมัติ</option>
                                        <option value="กำลังดำเนินการ">กำลังดำเนินการ</option>
                                        <option value="งาน PM">งาน PM</option>
                                        <option value="เสร็จสิ้น">เสร็จสิ้น</option>
                                    </select>
                                    <span v-else :class="getStatusBadgeClass(displayStatus(item))" class="text-xs px-2 py-0.5 rounded font-medium">
                                        {{ displayStatus(item) }}
                                    </span>
                                </td>
                                <td v-if="session.role === 'admin'" class="p-3 text-center">
                                    <button @click="openEditCmModal(item)" title="แก้ไขข้อมูลใบงานนี้" class="text-slate-300 hover:text-purple-600 transition">
                                        <i class="fa-solid fa-gear"></i>
                                    </button>
                                </td>
                            </tr>
                            <tr v-if="sortedCmTickets.length === 0">
                                <td colspan="7" class="p-6 text-center text-sm text-slate-400">ไม่มีใบงาน CM ตรงตามเงื่อนไขที่เลือก</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- INSTALLATION SITES -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                    <div>
                        <h2 class="font-bold text-slate-800 flex items-center">
                            <i class="fa-solid fa-list text-purple-600 mr-2"></i> รายการสถานที่ติดตั้งอุปกรณ์ระบบวิทยุสื่อสารแบบ Digital กฟก.1
                        </h2>
                    </div>
                    <div class="w-64">
                        <input v-model="searchQuery" type="text" placeholder="ค้นหาสถานที่/อุปกรณ์..." class="w-full text-xs p-2 border border-slate-300 rounded-lg focus:outline-none focus:border-purple-500">
                    </div>
                </div>
                <div class="overflow-x-auto max-h-80">
                    <table class="w-full text-left border-collapse text-xs">
                        <thead class="sticky top-0 bg-slate-100 text-slate-600 uppercase border-b">
                            <tr>
                                <th class="p-2.5 text-center w-12">ลำดับ</th>
                                <th class="p-2.5">สถานที่ติดตั้งอุปกรณ์</th>
                                <th class="p-2.5">จังหวัด</th>
                                <th class="p-2.5">อุปกรณ์ที่ติดตั้ง</th>
                                <th class="p-2.5 text-center w-24">จำนวน (ชุด)</th>
                                <th v-if="session.role === 'admin'" class="p-2.5 text-center w-10"></th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100">
                            <tr v-for="item in filteredInstallationSites" :key="item.no" class="hover:bg-slate-50">
                                <td class="p-2.5 text-center font-bold text-slate-400">{{ item.no }}</td>
                                <td class="p-2.5 font-medium text-slate-800">{{ friendlySiteName(item.location) }}</td>
                                <td class="p-2.5 text-slate-600">{{ item.province || '-' }}</td>

    <script>
        const { createApp } = Vue;

        /**
         * Legend แบบเขียนเอง (HTML ธรรมดา ไม่ใช่ของ built-in ของ Chart.js) สำหรับกราฟโดนัท:
         * ปกติ Chart.js จะขีดฆ่าข้อความของรายการที่ถูกกดปิดไว้ (built-in behaviour) — อันนี้เปลี่ยนเป็น
         * ทำให้สีวงกลมกับตัวอักษรของรายการนั้นจางลงแทน โดยผูกกับ container ผ่าน options.plugins.htmlLegend.containerID
         */
        const htmlLegendPlugin = {
            id: 'htmlLegend',
            afterUpdate(chart, args, options) {
                const container = document.getElementById(options.containerID);
                if (!container) return;
                container.innerHTML = '';
                const items = chart.options.plugins.legend.labels.generateLabels(chart);
                items.forEach((item) => {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'flex items-center gap-1.5 text-xs font-medium transition-opacity';
                    btn.style.opacity = item.hidden ? '0.3' : '1';
                    btn.onclick = () => {
                        chart.toggleDataVisibility(item.index);
                        chart.update();
                    };
                    const swatch = document.createElement('span');
                    swatch.style.cssText = 'width:10px;height:10px;border-radius:9999px;display:inline-block;flex:none;background-color:' + item.fillStyle;
                    const label = document.createElement('span');
                    label.className = 'text-slate-600';
                    label.textContent = item.text;
                    btn.appendChild(swatch);
                    btn.appendChild(label);
                    container.appendChild(btn);
                });
            },
        };

        // TODO: วาง Web App URL ที่ได้จากการ Deploy Google Apps Script ตรงนี้
        const API_URL = 'https://script.google.com/macros/s/AKfycbxxUCQk03kQGuj24D5dDrvoJjKhCWcwVpFByd73BYYtuIuzjaI668gU7gYTfRSjlTRa/exec';
        const TOKEN_STORAGE_KEY = 'p25_dashboard_session';
        const THAI_MONTHS = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน',
            'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
        const CURRENT_BUDDHIST_YEAR = new Date().getFullYear() + 543;

        createApp({
            data() {
                return {
                    session: null,     // { token, username, role, displayName }
                    loginForm: { username: '', password: '', loading: false, error: '' },

                    currentView: 'dashboard', // 'dashboard' | 'users'

                    apiError: '',
                    initialLoading: false,
                    showInitialLoader: false,
                    searchQuery: '',
                    cmStatusFilter: '',
                    cmProvinceFilter: '',

                    importHistory: [],
                    currentImportId: null,
                    dashboard: { sitesSummary: [], installationSites: [], pmStatus: [], cmTickets: [], equipmentFailureSummary: [], staffSummary: [] },
                    provinceStats: { byProvince: [], bySite: [] },
                    provinceFilter: '',
                    siteFilter: '',
                    provinceViewMetric: 'cm', // 'cm' | 'pm'
                    donutFilter: 'all', // 'all' | 'pm' | 'cm'
                    trend: [],
                    showTrend: false,
                    importing: false,

                    reportFiles: [],
                    reportYear: CURRENT_BUDDHIST_YEAR,
                    reportMonth: '', // '' = ทั้งปี, 1-12 = เดือนนั้นๆ

                    users: [],
                    userRows: [],
                    newUserForm: { username: '', password: '', displayName: '', role: 'pea', saving: false, error: '' },
                    // pop-up แก้ไขผู้ใช้งาน (แทนการแก้ inline ในตารางแบบเดิม)
                    showEditUserModal: false,
                    editUserForm: { username: '', displayName: '', role: 'pea', password: '', saving: false, error: '' },
                    showDeleteUserConfirm: false,
                    deletingUser: false,
                    deleteUserError: '',
                    userImport: { dragOver: false, importing: false, error: '', result: null },

                    charts: { overall: null, site: null, trend: null },
                    chartsError: '', // ข้อความ error ที่จับได้จากการวาดกราฟ (โชว์ในหน้าเว็บ แทนที่จะเงียบแล้วปล่อยกราฟว่าง)

                    ticketDetail: null,
                    ticketDetailLoading: false,
                    showTicketModal: false,

                    showAddCmModal: false,
                    addCmForm: { ticketId: '', site: '', province: '', system: '', reportedAt: '', status: 'รอดำเนินการ', saving: false, error: '', siteSuggestOpen: false, provinceSuggestOpen: false },

                    showEditSiteModal: false,
                    editSiteForm: { no: null, location: '', province: '', saving: false, error: '', locationSuggestOpen: false, provinceSuggestOpen: false },

                    showEditCmModal: false,
                    editCmForm: { ticketId: '', site: '', province: '', system: '', reportedAt: '', status: 'รอดำเนินการ', saving: false, error: '', siteSuggestOpen: false, provinceSuggestOpen: false },
                    // ลิงก์เปิด Google Sheet ตรง (เฉพาะ admin) — มาจาก bootstrap()/getSheetLinks()
                    sheetLinks: null,
                };
            },
            computed: {
                // ตัวเลือกปีของกล่อง "รายงานการซ่อมบำรุง" — ย้อนหลัง 5 ปีถึงปีถัดไป (เผื่อโฟลเดอร์เตรียมไว้ล่วงหน้า) เรียงใหม่สุดก่อน
                reportYearOptions() {
                    const years = [];
                    for (let y = CURRENT_BUDDHIST_YEAR + 1; y >= CURRENT_BUDDHIST_YEAR - 5; y--) years.push(y);
                    return years;
                },
                thaiMonths() {
                    return THAI_MONTHS;
                },
                filteredInstallationSites() {
                    const list = this.dashboard.installationSites;
                    if (!this.searchQuery) return list;
                    const q = this.searchQuery.toLowerCase();
                    return list.filter(item =>
                        (item.location || '').toLowerCase().includes(q) ||
                        (item.equipment || '').toLowerCase().includes(q)
                    );
                },
                selectedImportExcelUrl() {
                    const found = this.importHistory.find(h => h.importId === this.currentImportId);
                    return found ? found.excelFileUrl : '';
                },
                cmProvinceOptions() {
                    const set = new Set(this.dashboard.cmTickets.map(t => t.province).filter(Boolean));
                    return Array.from(set).sort();
                },
                provinceOptions() {
                    return this.provinceStats.byProvince.map(p => p.province).sort();
                },
                donutHasData() {
                    const cmCount = (this.dashboard.cmTickets || []).length;
                    const pmTotal = (this.dashboard.pmStatus || []).reduce((sum, p) => sum + (Number(p.total) || 0), 0);
                    return cmCount > 0 || pmTotal > 0;
                },
                siteNameOptions() {
                    // Known site names for this round, used as autocomplete suggestions
                    // on the "สถานที่ติดตั้งอุปกรณ์" fields.
                    const set = new Set(this.dashboard.installationSites.map(s => s.location).filter(Boolean));
                    return Array.from(set).sort();
                },
                siteOptionsForProvince() {
                    if (!this.provinceFilter) return [];
                    return this.provinceStats.bySite
                        .filter(s => s.province === this.provinceFilter)
                        .map(s => s.site)
                        .sort();
                },
                sortedCmTickets() {
                    // Overdue first (most overdue first), then open tickets soonest-due first, finished last
                    const list = this.dashboard.cmTickets.filter(t => {
                        if (this.cmStatusFilter && this.displayStatus(t) !== this.cmStatusFilter) return false;
                        if (this.cmProvinceFilter && t.province !== this.cmProvinceFilter) return false;
                        return true;
                    });
                    return list.slice().sort((a, b) => {
                        const rank = t => t.status === 'เสร็จสิ้น' ? 2 : (t.slaHoursLeft < 0 ? 0 : 1);
                        const ra = rank(a), rb = rank(b);
                        if (ra !== rb) return ra - rb;
                        return a.slaHoursLeft - b.slaHoursLeft;
                    });
                },
                overdueCmCount() {
                    return this.dashboard.cmTickets.filter(t => this.displayStatus(t) === 'เกิน SLA').length;
                },
            },
            async mounted() {
                const saved = localStorage.getItem(TOKEN_STORAGE_KEY);
                if (saved) {
                    try {
                        this.session = JSON.parse(saved);
                        await this.bootstrapLoad();
                    } catch (err) {
                        this.session = null;
                        localStorage.removeItem(TOKEN_STORAGE_KEY);
                    }
                }
            },
            methods: {
                roleLabel(role) {
                    return { admin: 'ผู้ดูแลระบบ', pea: 'เจ้าหน้าที่ PEA' }[role] || role;
                },

                async submitLogin() {
                    if (!this.loginForm.username || !this.loginForm.password) {
                        this.loginForm.error = 'กรุณากรอกชื่อผู้ใช้และรหัสผ่าน';
                        return;
                    }
                    this.loginForm.loading = true;
                    this.loginForm.error = '';
                    try {
                        const res = await fetch(API_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                            body: JSON.stringify({
                                action: 'login',
                                params: { username: this.loginForm.username, password: this.loginForm.password },
                            }),
                        });
                        const json = await this.parseJsonResponse(res);
                        if (!json.ok) throw new Error(json.error || 'เข้าสู่ระบบไม่สำเร็จ');

                        this.session = json.data;
                        localStorage.setItem(TOKEN_STORAGE_KEY, JSON.stringify(this.session));
                        this.loginForm = { username: '', password: '', loading: false, error: '' };
                        await this.bootstrapLoad();
                    } catch (err) {
                        this.loginForm.error = err.message;
                        this.loginForm.loading = false;
                    }
                },

                async doLogout() {
                    try { await this.api('logout'); } catch (err) { /* ignore */ }
                    this.session = null;
                    this.currentView = 'dashboard';
                    localStorage.removeItem(TOKEN_STORAGE_KEY);
                },

                /**
                 * Parses a fetch Response as JSON. When the server didn't return valid JSON,
                 * inspects the raw text to figure out *why* instead of always blaming the
                 * deploy permission — that used to be the only message shown here, which was
                 * misleading whenever the real cause was something else (e.g. Apps Script kept
                 * running and actually saved the change, but the HTTP response itself timed out
                 * on the way back — refreshing then shows the change went through after all).
                 */
                async parseJsonResponse(res) {
                    const text = await res.text();
                    try {
                        return JSON.parse(text);
                    } catch (err) {
                        if (API_URL.includes('XXXXXXXX')) {
                            throw new Error('ยังไม่ได้ตั้งค่า API_URL — กรุณานำ Web App URL ของ Google Apps Script มาใส่ในโค้ด (ตัวแปร API_URL)');
                        }
                        // Google ส่งหน้า HTML "ขอ sign in" กลับมาแทน JSON จริงๆ เฉพาะกรณีสิทธิ์ deploy ผิด
                        if (/accounts\.google\.com|ServiceLogin|isn't verified|ไม่ได้รับอนุญาต/i.test(text)) {
                            throw new Error('เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ — ดูเหมือน Deploy Google Apps Script ยังตั้งสิทธิ์การเข้าถึงไม่ใช่ "Anyone" (Google ส่งหน้าล็อกอินกลับมาแทนข้อมูล) กรุณาตรวจสอบใน Deploy > Manage deployments อีกครั้ง');
                        }
                        // Response ว่างเปล่า/ขาดกลางทาง — มักเกิดจาก Apps Script รันช้ากว่าที่ browser รอไหว
                        // (เช่น ชีทมีแถวเยอะ) ตัวฟังก์ชันบน server ส่วนใหญ่จะรันจนจบอยู่ดีและบันทึกสำเร็จ
                        // แม้ response จะมาไม่ทัน — ไม่ใช่ปัญหาสิทธิ์ deploy เลย
                        if (!text || text.trim().length === 0) {
                            throw new Error('เซิร์ฟเวอร์ตอบกลับไม่ทัน (การเชื่อมต่อหลุดระหว่างรอผล) — ปกติแล้ว Apps Script จะรันจนจบและบันทึกข้อมูลสำเร็จอยู่ดี กรุณา "รีเฟรชหน้าเว็บ" เพื่อตรวจสอบก่อนว่าข้อมูลบันทึกไปแล้วหรือยัง แล้วค่อยลองทำซ้ำถ้ายังไม่ขึ้น (เพื่อไม่ให้บันทึกซ้ำซ้อน)');
                        }
                        // เหลือกรณีอื่นที่ไม่รู้จักแน่ชัด — ไม่ฟันธงว่าเป็นเรื่องสิทธิ์ deploy อีกต่อไป
                        throw new Error('เซิร์ฟเวอร์ตอบกลับมาในรูปแบบที่ไม่คาดคิด (ไม่ใช่ JSON) กรุณารีเฟรชหน้าเว็บเพื่อตรวจสอบว่าข้อมูลบันทึกไปแล้วหรือไม่ ก่อนลองใหม่ ถ้ายังเจอซ้ำๆ ให้ตรวจ Deploy > Manage deployments ว่าเวอร์ชันที่ deploy อยู่เป็นเวอร์ชันล่าสุดของโค้ดหรือยัง (แก้โค้ดแล้วต้องกด "New version" ทุกครั้ง ไม่ใช่แค่ Save)');
                    }
                },

                /** Single bridge to the GAS Web App — mirrors the dispatch(action, params) convention */
                async api(action, params) {
                    let res;
                    try {
                        res = await fetch(API_URL, {
                            method: 'POST',
                            // text/plain avoids a CORS preflight against the Apps Script endpoint
                            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                            body: JSON.stringify({ action, params: Object.assign({}, params, { token: this.session ? this.session.token : null }) }),
                        });
                    } catch (networkErr) {
                        // fetch() เองล้มเหลว (เน็ตหลุด/CORS/DNS) — คนละกรณีกับสิทธิ์ deploy ผิด
                        throw new Error('เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ (เครือข่ายขัดข้องหรือเรียก API ไม่ถึง): ' + networkErr.message);
                    }
                    const json = await this.parseJsonResponse(res);
                    if (!json.ok) {
                        if (/เข้าสู่ระบบ|เซสชันหมดอายุ/.test(json.error || '')) {
                            this.session = null;
                            localStorage.removeItem(TOKEN_STORAGE_KEY);
                        }
                        throw new Error(json.error || 'ไม่ทราบสาเหตุ');
                    }
                    return json.data;
                },

                /**
                 * Single combined call replacing the old sequence of
                 * getImportHistory -> getDashboardData+getProvinceStats -> getReportFiles
                 * (-> getUsers for admin) — 4-5 separate round trips to the Web App down to
                 * 1, so first paint after login/reload only waits on one request. Shows
                 * nothing for the first second (a fast load shouldn't flash a spinner), then
                 * a spinner if the request is genuinely slow.
                 */
                async bootstrapLoad() {
                    this.initialLoading = true;
                    this.showInitialLoader = false;
                    const timer = setTimeout(() => { if (this.initialLoading) this.showInitialLoader = true; }, 1000);
                    try {
                        this.apiError = '';
                        const data = await this.api('bootstrap', { reportYear: this.reportYear, reportMonth: this.reportMonth || undefined });
                        if (!data) throw new Error('BOOTSTRAP_EMPTY_RESPONSE');
                        this.importHistory = data.importHistory || [];
                        if (this.importHistory.length > 0) this.currentImportId = this.importHistory[0].importId;
                        this.dashboard = Object.assign({ equipmentFailureSummary: [], staffSummary: [] }, data.dashboard);
                        this.provinceStats = Object.assign({ byProvince: [], bySite: [] }, data.provinceStats);
                        this.reportFiles = data.reportFiles || [];
                        if (this.session.role === 'admin') {
                            this.users = data.users || [];
                            this.userRows = this.users.map(u => ({
                                username: u.username, displayName: u.displayName, role: u.role,
                                password: '', saving: false, error: '',
                            }));
                            this.sheetLinks = data.sheetLinks || null;
                        }
                    } catch (err) {
                        // Most likely cause: the frontend was updated but the Apps Script
                        // backend hasn't been re-deployed with the 'bootstrap' action yet
                        // (dispatch() there still throws "ไม่รู้จัก action" for it, or an
                        // even older deployment returns something unexpected). Rather than
                        // show an error, fall back to the old sequence of separate calls so
                        // the dashboard still works — once the backend IS redeployed, the
                        // fast path above just starts succeeding on its own, no other change needed.
                        try {
                            await this.loadImportHistory();
                            await this.loadReportFiles();
                            if (this.session.role === 'admin') {
                                await this.loadUsers();
                                try { this.sheetLinks = await this.api('getSheetLinks'); } catch (e2) { /* non-critical */ }
                            }
                        } catch (fallbackErr) {
                            this.apiError = fallbackErr.message;
                        }
                    } finally {
                        clearTimeout(timer);
                        this.initialLoading = false;
                        this.showInitialLoader = false;
                        this.$nextTick(() => this.renderMainCharts());
                    }
                },

                async loadImportHistory() {
                    try {
                        this.apiError = '';
                        this.importHistory = await this.api('getImportHistory');
                        if (this.importHistory.length > 0) {
                            this.currentImportId = this.importHistory[0].importId; // newest
                            await this.loadDashboard(this.currentImportId);
                        }
                    } catch (err) {
                        this.apiError = err.message;
                    }
                },

                async loadDashboard(importId) {
                    try {
                        this.apiError = '';
                        const [data, provinceStats] = await Promise.all([
                            this.api('getDashboardData', { importId }),
                            this.api('getProvinceStats', { importId }),
                        ]);
                        this.dashboard = Object.assign({ equipmentFailureSummary: [], staffSummary: [] }, data);
                        this.provinceStats = Object.assign({ byProvince: [], bySite: [] }, provinceStats);
                        this.provinceFilter = '';
                        this.siteFilter = '';
                        this.donutFilter = 'all';
                        this.provinceViewMetric = 'cm';
                        this.$nextTick(() => this.renderMainCharts());
                    } catch (err) {
                        this.apiError = err.message;
                    }
                },

                onSelectImportRound() {
                    this.loadDashboard(this.currentImportId);
                },

                async loadTrend() {
                    try {
                        this.trend = await this.api('getTrend');
                        this.$nextTick(() => this.renderTrendChart());
                    } catch (err) {
                        this.apiError = err.message;
                    }
                },

                async loadReportFiles() {
                    try {
                        this.reportFiles = await this.api('getReportFiles', { year: this.reportYear, month: this.reportMonth || undefined });
                    } catch (err) {
                        this.apiError = err.message;
                    }
                },

                handleFileChange(e) {
                    const file = e.target.files[0];
                    if (!file) return;
                    this.importing = true;
                    const reader = new FileReader();
                    reader.onload = async () => {
                        try {
                            const base64 = reader.result.split(',')[1];
                            const { importId } = await this.api('importExcel', {
                                fileName: file.name,
                                mimeType: file.type,
                                base64: base64,
                            });
                            await this.loadImportHistory();
                            this.currentImportId = importId;
                            await this.loadDashboard(importId);
                        } catch (err) {
                            this.apiError = err.message;
                            alert('นำเข้าข้อมูลไม่สำเร็จ: ' + err.message);
                        } finally {
                            this.importing = false;
                            e.target.value = '';
                        }
                    };
                    reader.readAsDataURL(file);
                },

                async loadUsers() {
                    try {
                        this.users = await this.api('getUsers');
                        this.userRows = this.users.map(u => ({
                            username: u.username, displayName: u.displayName, role: u.role,
                        }));
                    } catch (err) {
                        this.apiError = err.message;
                    }
                },

                handleUserImportChange(e) {
                    const file = e.target.files[0];
                    e.target.value = '';
                    if (file) this.importUserFile(file);
                },

                handleUserImportDrop(e) {
                    this.userImport.dragOver = false;
                    const file = e.dataTransfer.files[0];
                    if (file) this.importUserFile(file);
                },

                importUserFile(file) {
                    this.userImport.importing = true;
                    this.userImport.error = '';
                    this.userImport.result = null;
                    const reader = new FileReader();
                    reader.onload = async () => {
                        try {
                            const base64 = reader.result.split(',')[1];
                            const result = await this.api('importUsers', {
                                fileName: file.name, mimeType: file.type, base64: base64,
                            });
                            this.userImport.result = result;
                            await this.loadUsers();
                        } catch (err) {
                            this.userImport.error = err.message;
                        } finally {
                            this.userImport.importing = false;
                        }
                    };
                    reader.readAsDataURL(file);
                },

                downloadUserTemplate() {
                    const ws = XLSX.utils.aoa_to_sheet([
                        ['ชื่อที่แสดง', 'ชื่อผู้ใช้งาน', 'รหัสผ่าน', 'role (pea หรือ admin)'],
                        ['ตัวอย่าง สมชาย ใจดี', 'somchai.j', 'Password123', 'pea'],

                    XLSX.utils.book_append_sheet(wb, ws, 'Users');

                exportUsers() {
                    const rows = this.users.map(u => ({
                        'ชื่อที่แสดง': u.displayName,

                },

                // เปิด pop-up แก้ไขผู้ใช้งาน (ชื่อที่แสดง/สิทธิ์/รหัสผ่านใหม่) — เข้าจากปุ่มฟันเฟืองในตาราง
                openEditUserModal(row) {
                    this.editUserForm = { username: row.username, displayName: row.displayName, role: row.role, password: '', saving: false, error: '' };
                    this.showEditUserModal = true;
                },
                closeEditUserModal() {
                    this.showEditUserModal = false;
                },
                async saveEditUserModal() {
                    const f = this.editUserForm;
                    f.saving = true;
                    f.error = '';
                    try {
                        await this.api('updateUser', {
                            username: f.username,
                            displayName: f.displayName,
                            role: f.role,
                            password: f.password || undefined,
                        });
                        this.showEditUserModal = false;
                        await this.loadUsers();
                    } catch (err) {
                        f.error = err.message;
                        f.saving = false;
                    }
                },
                // pop-up ยืนยันลบ — ซ้อนบน pop-up แก้ไข แทนการใช้ confirm() ของเบราว์เซอร์แบบเดิม
                openDeleteUserConfirm() {

                closeDeleteUserConfirm() {

                async deleteUserConfirmed() {

                        await this.api('deleteUser', { username: this.editUserForm.username });

                        await this.loadUsers();
                    } catch (err) {

                    }
                },

                async submitNewUser() {
                    const f = this.newUserForm;

                        f.error = 'กรุณากรอกให้ครบทุกช่อง';

                    f.saving = true;
                    f.error = '';
                    try {
                        await this.api('createUser', {

                        });

                        await this.loadUsers();
                    } catch (err) {

                        f.saving = false;
                    }
                },

                async updateStatus(item) {

                        await this.api('updateCmTicketStatus', { ticketId: item.ticketId, status: item.status });
                        await this.loadDashboard(this.currentImportId);
                    } catch (err) {
                        alert('อัปเดตสถานะไม่สำเร็จ: ' + err.message);
                    }
                },

                async openTicketDetail(item) {

                        this.ticketDetail = await this.api('getWorkOrderDetail', { importId: this.currentImportId, ticketId: item.ticketId });

                        this.ticketDetail = null; // treat any error the same as "no extra detail" rather than blocking the modal
                    } finally {
                        this.ticketDetailLoading = false;

                    this.showTicketModal = false;
                    this.ticketDetail = null;
                },

                /** ข้อ 3: เพิ่มใบงาน CM ด้วยมือ (admin) — ไม่บังคับกรอกครบทุกช่อง เขียนตรงลงชีท CMTickets ของรอบที่เลือกอยู่ */
                openAddCmModal() {
                    this.addCmForm = { ticketId: '', site: '', province: '', system: '', reportedAt: '', status: 'รอดำเนินการ', saving: false, error: '', siteSuggestOpen: false, provinceSuggestOpen: false };

                },
                closeAddCmModal() {
                    this.showAddCmModal = false;
                },
                async submitAddCmTicket() {

                    if (!this.currentImportId) {
                        f.error = 'ยังไม่มีรอบข้อมูลให้ผูกรายการนี้ — นำเข้าข้อมูล Excel อย่างน้อย 1 รอบก่อน';
                        return;
                    }

                    f.error = '';
                    try {
                        await this.api('createCmTicket', {

                            province: f.province || undefined,
                            system: f.system || undefined,
                            reportedAt: f.reportedAt || undefined,
                            status: f.status,
                        });
                        this.showAddCmModal = false;
                        await this.loadDashboard(this.currentImportId);
                    } catch (err) {

                    } finally {

                },

                /** ข้อ 4: แก้ไข สถานที่ติดตั้ง/จังหวัด ของแถวในตาราง InstallationSites (admin) — เขียนตรงลงชีท InstallationSites_Snapshot */
                openEditSiteModal(item) {
                    this.editSiteForm = { no: item.no, location: item.location, province: item.province || '', saving: false, error: '', locationSuggestOpen: false, provinceSuggestOpen: false };
                    this.showEditSiteModal = true;
                },
                closeEditSiteModal() {
                    this.showEditSiteModal = false;
                },
                async submitEditSite() {
                    const f = this.editSiteForm;
                    f.saving = true;
                    f.error = '';
                    try {
                        await this.api('updateInstallationSite', {
                            importId: this.currentImportId,

                            province: f.province,
                        });

                        await this.loadDashboard(this.currentImportId);
                    } catch (err) {
                        f.error = err.message;
                    } finally {
                        f.saving = false;
                    }
                },

                /** แปลงค่าวันที่ (จากชีท/API) ให้เป็นสตริงที่ input type="datetime-local" รับได้ (YYYY-MM-DDTHH:mm ตามเวลาท้องถิ่น) */
                toDateTimeLocalValue(value) {
                    if (!value) return '';
                    const d = new Date(value);
                    if (isNaN(d)) return '';
                    const pad = n => String(n).padStart(2, '0');
                    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
                },

                /** ปุ่มฟันเฟือง (แก้ไข) ในตาราง "รายการแจ้งซ่อม CM" — แก้ไขข้อมูลเต็มของใบงานนั้น เขียนตรงลงชีท CMTickets */
                openEditCmModal(item) {
                    this.editCmForm = {
                        ticketId: item.ticketId,
                        site: item.site || '',
                        province: item.province || '',
                        system: item.system || '',
                        reportedAt: this.toDateTimeLocalValue(item.reportedAt),
                        status: item.status || 'รอดำเนินการ',
                        saving: false, error: '', siteSuggestOpen: false, provinceSuggestOpen: false,
                    };
                    this.showEditCmModal = true;
                },
                closeEditCmModal() {
                    this.showEditCmModal = false;
                },
                async submitEditCmTicket() {
                    const f = this.editCmForm;
                    f.saving = true;
                    f.error = '';
                    try {
                        await this.api('updateCmTicket', {
                            ticketId: f.ticketId,
                            site: f.site,
                            province: f.province,
                            system: f.system,
                            reportedAt: f.reportedAt || undefined,
                            status: f.status,
                        });
                        this.showEditCmModal = false;
                        await this.loadDashboard(this.currentImportId);
                    } catch (err) {
                        f.error = err.message;
                    } finally {
                        f.saving = false;
                    }
                },

                /**
                 * ข้อ 4: ย่อ/แปลงชื่อสถานที่ให้อ่านง่ายขึ้นสำหรับแสดงในตาราง (best-effort ตามตัวอย่างที่ให้มา)
                 * เช่น "สฟฟ.บ้านลาดทราย Base Station" -> "สถานีไฟฟ้า บ้านลาดทราย"
                 *      "กฟก.1 อาคาร 3 ชั้น 2 Server Room MSO" -> "การไฟฟ้าส่วนภูมิภาค เขต 1 ภาคกลาง"
                 *      "กฟอ.ธัญบุรี Base Station" -> "การไฟฟ้าส่วนภูมิภาคสาขาธัญบุรี"
                 * หมายเหตุ: ชื่อดิบเดิมจากไฟล์ยังเก็บไว้ครบ (ใช้ในการค้นหา/ผูกข้อมูล) นี่แค่ทำ label แสดงผลเท่านั้น
                 */
                friendlySiteName(name) {
                    const s = String(name || '').trim();
                    if (!s) return '-';
                    let m = s.match(/^กฟก\.\s*(\d+)/);
                    if (m) return 'การไฟฟ้าส่วนภูมิภาค เขต ' + m[1] + ' ภาคกลาง';
                    m = s.match(/^กฟอ\.\s*(\S+)/);
                    if (m) return 'การไฟฟ้าส่วนภูมิภาคสาขา' + m[1];
                    m = s.match(/^สฟฟ\.\s*(\S+)/);
                    if (m) return 'สถานีไฟฟ้าส่วนภูมิภาค ' + m[1];
                    return s;
                },

                displayStatus(item) {
                    if (item.status !== 'เสร็จสิ้น' && item.slaHoursLeft < 0) return 'เกิน SLA';
                    return item.status;
                },
                formatSlaTime(item) {
                    if (item.status === 'เสร็จสิ้น') return 'ดำเนินการเสร็จแล้ว';
                    if (item.slaHoursLeft < 0) return `เกินกำหนด ${Math.abs(item.slaHoursLeft)} ชม.`;
                    return `เหลืออีก ${item.slaHoursLeft} ชม.`;
                },
                getSlaBadgeClass(item) {
                    if (item.status === 'เสร็จสิ้น') return 'bg-slate-100 text-slate-600';
                    if (item.slaHoursLeft < 0) return 'bg-red-100 text-red-700 animate-pulse';
                    if (item.slaHoursLeft <= 4) return 'bg-amber-100 text-amber-800';
                    return 'bg-emerald-100 text-emerald-800';
                },
                getStatusBadgeClass(status) {
                    if (status === 'เสร็จสิ้น') return 'bg-emerald-100 text-emerald-700';
                    if (status === 'กำลังดำเนินการ') return 'bg-blue-100 text-blue-700';
                    if (status === 'งาน PM') return 'bg-purple-100 text-purple-700';
                    if (status === 'รออนุมัติ') return 'bg-amber-100 text-amber-700';
                    if (status === 'เกิน SLA') return 'bg-red-100 text-red-700';
                    return 'bg-slate-100 text-slate-700';
                },
                formatDate(value) {
                    if (!value) return '-';
                    const d = new Date(value);
                    if (isNaN(d)) return String(value);
                    return d.toLocaleDateString('th-TH', { year: 'numeric', month: 'short', day: 'numeric' });
                },
                formatMonthYearThai(value) {
                    if (!value) return '-';
                    const d = new Date(value);
                    if (isNaN(d)) return String(value);
                    return THAI_MONTHS[d.getMonth()] + ' ' + (d.getFullYear() + 543);
                },
                formatDateTime(value) {
                    if (!value) return '-';
                    const d = new Date(value);
                    if (isNaN(d)) return String(value);
                    return d.toLocaleString('th-TH', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
                },

                renderMainCharts() {
                    // เดิมถ้า Chart.js โหลดไม่สำเร็จ (เช่นไฟล์ vendor/chart.umd.min.js หาย/พาธผิด)
                    // หรือ renderOverallChart/renderProvinceChart โยน error ใดๆ กราฟจะค้างว่างเปล่าแบบเงียบๆ
                    // ไม่มีทางรู้ได้จากหน้าเว็บเลยว่าเกิดอะไรขึ้น — ตอนนี้จับ error แล้วโชว์ข้อความให้เห็นแทน
                    this.chartsError = '';
                    try {
                        if (typeof Chart === 'undefined') {
                            throw new Error('โหลดไลบรารี Chart.js ไม่สำเร็จ (เช็คว่าไฟล์ vendor/chart.umd.min.js อยู่ครบและ path ถูกต้องหรือไม่ — ดู vendor/README_DOWNLOAD_VENDOR_FILES.md)');
                        }
                        this.renderOverallChart();
                        this.renderProvinceChart();
                    } catch (err) {
                        this.chartsError = err.message;
                        console.error('renderMainCharts failed:', err);
                    }
                },

                /** CM tickets grouped into the 3 severity buckets used by the donut + province chart. */
                cmSeverityCounts() {
                    const counts = { active: 0, done: 0, overdue: 0 };
                    this.dashboard.cmTickets.forEach(t => {
                        const s = this.displayStatus(t);
                        if (s === 'เกิน SLA') counts.overdue++;
                        else if (s === 'เสร็จสิ้น') counts.done++;
                        else counts.active++; // รอดำเนินการ / รออนุมัติ / กำลังดำเนินการ — all still "กำลังทำ" from an overview standpoint
                    });
                    return counts;
                },

                /** ข้อ 6: PM vs CM donut, with click-to-drill-down into either side. */
                renderOverallChart() {
                    const canvas = document.getElementById('overallChart');
                    if (!canvas) return;
                    if (this.charts.overall) this.charts.overall.destroy();

                    let labels, values, colors;
                    if (this.donutFilter === 'pm') {
                        const totals = this.dashboard.pmStatus.reduce(
                            (acc, p) => ({ total: acc.total + (Number(p.total) || 0), done: acc.done + (Number(p.done) || 0) }),
                            { total: 0, done: 0 }
                        );
                        labels = ['PM เสร็จสิ้น', 'PM ค้างดำเนินการ'];
                        values = [totals.done, totals.total - totals.done];
                        colors = ['#8b5cf6', '#ddd6fe'];
                    } else if (this.donutFilter === 'cm') {
                        const cm = this.cmSeverityCounts();
                        labels = ['CM กำลังทำ', 'CM แก้ไขเสร็จ', 'CM เกิน SLA'];
                        values = [cm.active, cm.done, cm.overdue];
                        colors = ['#f87171', '#fecaca', '#b91c1c'];
                    } else {
                        const pmTotal = this.dashboard.pmStatus.reduce((sum, p) => sum + (Number(p.total) || 0), 0);
                        const cm = this.cmSeverityCounts();
                        labels = ['PM', 'CM กำลังทำ', 'CM แก้ไขเสร็จ', 'CM เกิน SLA'];
                        values = [pmTotal, cm.active, cm.done, cm.overdue];
                        colors = ['#8b5cf6', '#f87171', '#fecaca', '#b91c1c'];
                    }

                    // Drop zero-value slices so the donut isn't cluttered by statuses that never occurred this round
                    const slices = labels
                        .map((l, i) => ({ label: l, value: values[i], color: colors[i] }))
                        .filter(x => x.value > 0);
                    const total = slices.reduce((s, x) => s + x.value, 0);

                    this.charts.overall = new Chart(canvas, {
                        type: 'doughnut',
                        data: {
                            labels: slices.map(x => x.label),
                            datasets: [{ data: slices.map(x => x.value), backgroundColor: slices.map(x => x.color) }],
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: { display: false }, // ใช้ legend แบบเขียนเอง (htmlLegendPlugin) ด้านล่างกราฟแทน
                                htmlLegend: { containerID: 'overallChartLegend' },
                                tooltip: {
                                    callbacks: {
                                        label: (item) => {
                                            const pct = total ? Math.round((item.parsed / total) * 100) : 0;
                                            return item.label + ': ' + item.parsed + ' งาน (' + pct + '%)';
                                        },
                                    },
                                },
                            },
                            onClick: (evt, elements) => {
                                if (!elements.length || this.donutFilter !== 'all') return;
                                const clicked = slices[elements[0].index];
                                if (clicked.label === 'PM') {
                                    this.donutFilter = 'pm';
                                    this.provinceViewMetric = 'pm';
                                } else {
                                    this.donutFilter = 'cm';
                                    this.provinceViewMetric = 'cm';
                                }
                                this.renderOverallChart();
                            },
                        },
                        plugins: [htmlLegendPlugin],
                    });
                },
                resetDonut() {
                    this.donutFilter = 'all';
                    this.renderOverallChart();
                },

                /** Simple "contains" filter behind the custom autocomplete dropdowns (site name / province fields). */
                matchSuggestions(list, query) {
                    const q = String(query || '').trim().toLowerCase();
                    if (!q) return list.slice(0, 8);
                    return list.filter(item => item.toLowerCase().includes(q)).slice(0, 8);
                },

                /** ข้อ 4/5: ย่อชื่อสถานที่ให้สั้นลงสำหรับแสดงบนแกนกราฟ (เป็น best-effort — ชื่อที่ไม่เข้ารูปแบบที่รู้จักจะคงไว้ตามเดิม) */
                abbreviateSiteLabel(name) {
                    let s = String(name || '').trim();
                    if (!s) return '';
                    // ตัดคำต่อท้ายจำพวกอาคาร/ชั้น/ประเภทห้อง/เฟส ออกทั้งหมดตั้งแต่จุดที่เจอ
                    s = s.replace(/\s+(Base\s*Station|Server\s*Room|Ph\.?\s*\d+|อาคาร\s*\S*|ชั้น\s*\S*|MSO|BTS|DPC)\b.*$/i, '').trim();
                    let m = s.match(/^(กฟก\.\s*\d+)/);
                    if (m) return m[1].replace(/\s+/g, '');
                    m = s.match(/^(กฟอ\.\s*\S+)/);
                    if (m) return m[1];
                    m = s.match(/^สฟฟ\.\s*(.+)$/);
                    if (m) return m[1].trim();
                    return s || String(name);
                },
                /** ขึ้นบรรทัดใหม่เฉพาะเมื่อ label ย่อแล้วยังยาวเกินไป และมีช่องว่างให้ตัดคำได้ */
                chartLabelLines(name) {
                    const abbrev = this.abbreviateSiteLabel(name);
                    if (abbrev.length <= 10) return abbrev;
                    const parts = abbrev.split(/\s+/).filter(Boolean);
                    return parts.length > 1 ? parts : abbrev;
                },
                /** สีคงที่ต่อประเภทอุปกรณ์ (BTS/MSO/DPC ฯลฯ) ให้สีเดิมทุกครั้งที่ประเภทเดียวกัน */
                colorForEquipmentType(type) {
                    const palette = ['#8b5cf6', '#3b82f6', '#10b981', '#f59e0b', '#ec4899', '#06b6d4', '#84cc16', '#f97316', '#6366f1', '#14b8a6'];
                    let hash = 0;
                    for (let i = 0; i < type.length; i++) hash = (hash * 31 + type.charCodeAt(i)) >>> 0;
                    return palette[hash % palette.length];
                },

                /** ข้อ 4/5/7: กราฟ "สถิติอุปกรณ์และสถานะงานแยกตามจังหวัด" — 2 แท่งต่อหมวด (อุปกรณ์ / CM หรือ PM) */
                renderProvinceChart() {
                    const canvas = document.getElementById('siteChart');
                    if (!canvas) return;
                    if (this.charts.site) this.charts.site.destroy();

                    let rows, labelFn;
                    if (this.siteFilter) {
                        rows = this.provinceStats.bySite.filter(s => s.site === this.siteFilter && s.province === this.provinceFilter);
                        labelFn = r => this.chartLabelLines(r.site);
                    } else if (this.provinceFilter) {
                        rows = this.provinceStats.bySite
                            .filter(s => s.province === this.provinceFilter)
                            .slice()
                            .sort((a, b) => b.equipmentTotal - a.equipmentTotal)
                            .slice(0, 10);
                        labelFn = r => this.chartLabelLines(r.site);
                    } else {
                        rows = this.provinceStats.byProvince.slice().sort((a, b) => b.equipmentTotal - a.equipmentTotal);
                        labelFn = r => r.province;
                    }

                    if (!rows || rows.length === 0) return;

                    const allTypes = Array.from(new Set(rows.flatMap(r => Object.keys(r.equipmentByType || {})))).sort();
                    const equipmentDatasets = allTypes.map(type => ({
                        stack: 'equipment',
                        label: 'อุปกรณ์ - ' + type,
                        data: rows.map(r => (r.equipmentByType && r.equipmentByType[type]) || 0),
                        backgroundColor: this.colorForEquipmentType(type),
                    }));

                    let statusDatasets;
                    if (this.provinceViewMetric === 'pm') {
                        statusDatasets = [
                            { stack: 'status', label: 'PM', data: rows.map(r => r.pmCount), backgroundColor: '#8b5cf6' },
                        ];
                    } else {
                        statusDatasets = [
                            { stack: 'status', label: 'CM กำลังทำ', data: rows.map(r => r.cm.active), backgroundColor: '#f87171' },
                            { stack: 'status', label: 'CM แก้ไขเสร็จ', data: rows.map(r => r.cm.done), backgroundColor: '#fecaca' },
                            { stack: 'status', label: 'CM เกิน SLA', data: rows.map(r => r.cm.overdue), backgroundColor: '#b91c1c' },
                        ];
                    }

                    this.charts.site = new Chart(canvas, {
                        type: 'bar',
                        data: { labels: rows.map(labelFn), datasets: [...equipmentDatasets, ...statusDatasets] },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            // ข้อ 2: intersect: true + mode: 'point' ทำให้ tooltip โชว์เฉพาะ dataset ที่ชี้ตรงๆ
                            // (ชี้แท่งอุปกรณ์ -> เห็นแค่จำนวนอุปกรณ์ประเภทนั้น, ชี้แท่ง CM/PM -> เห็นแค่สถานะนั้น) แทนที่จะรวมทุกอย่างมาแสดงพร้อมกัน
                            interaction: { mode: 'point', intersect: true },
                            scales: {
                                x: { stacked: true, ticks: { maxRotation: 0, minRotation: 0, autoSkip: false, font: { size: 10 } } },
                                y: { stacked: true, beginAtZero: true },
                            },
                            plugins: {
                                legend: { labels: { boxWidth: 10, font: { size: 10 } } },
                                tooltip: {
                                    callbacks: {
                                        title: (items) => {
                                            if (!items.length) return '';
                                            const r = rows[items[0].dataIndex];
                                            return r.site ? r.site : r.province;
                                        },
                                        label: (item) => {
                                            const ds = item.dataset;
                                            if (ds.stack === 'equipment') return 'จำนวนอุปกรณ์ (' + ds.label.replace(/^อุปกรณ์ - /, '') + '): ' + item.parsed.y;
                                            return ds.label + ': ' + item.parsed.y;
                                        },
                                        afterBody: (items) => {
                                            if (!items.length) return [];
                                            const item = items[0];
                                            if (item.dataset.stack !== 'status' || this.provinceViewMetric !== 'pm') return [];
                                            const r = rows[item.dataIndex];
                                            if (!r.pmRecords || !r.pmRecords.length) return [];
                                            return ['รอบ PM ที่ทำ:'].concat(
                                                r.pmRecords.slice(0, 6).map(p => '- ' + this.formatDate(p.reportedAt) + ' (' + p.status + ')')
                                            );
                                        },
                                    },
                                },
                            },
                        },
                    });
                },

                renderTrendChart() {
                    const canvas = document.getElementById('trendChart');
                    if (!canvas) return;
                    if (this.charts.trend) this.charts.trend.destroy();
                    this.charts.trend = new Chart(canvas, {
                        type: 'line',
                        data: {
                            labels: this.trend.map(t => this.formatMonthYearThai(t.dataDate)),
                            datasets: [
                                { label: 'จำนวนอุปกรณ์รวม', data: this.trend.map(t => t.totalQuantity), borderColor: '#8b5cf6', tension: 0.3 },
                                { label: '% PM เฉลี่ย', data: this.trend.map(t => t.avgPmPercent), borderColor: '#10b981', tension: 0.3 },
                            ],
                        },
                        options: { responsive: true, maintainAspectRatio: false },
                    });
                },
            },
            watch: {
                currentView(val, oldVal) {
                    // ออกจากหน้าแดชบอร์ด: v-if="currentView === 'dashboard'" จะลบ <canvas> เดิมออกจาก
                    // DOM ทั้งหมด ต้อง destroy Chart instance ก่อน ไม่งั้น listener เดิมจะค้างผูกกับ
                    // canvas ที่ถูกลบไปแล้ว (ต้นเหตุ error "Cannot read properties of undefined
                    // (reading 'handleEvent')" ที่เจอตอนกลับมาหน้าแดชบอร์ด)
                    if (oldVal === 'dashboard' && val !== 'dashboard') {
                        ['overall', 'site', 'trend'].forEach((key) => {
                            if (this.charts[key]) { this.charts[key].destroy(); this.charts[key] = null; }
                        });
                    }
                    // กลับมาหน้าแดชบอร์ด: <canvas> ที่ Vue สร้างขึ้นใหม่ยังไม่มีกราฟใดๆ วาดอยู่เลย ต้องวาดใหม่
                    if (val === 'dashboard') {
                        this.$nextTick(() => {
                            this.renderMainCharts();
                            if (this.showTrend) this.renderTrendChart();
                        });
                    }
                    // (lazy-load, ข้อ 5.2) เปิดแท็บ "จัดการผู้ใช้งาน": bootstrap ไม่ได้ส่งรายชื่อ user
                    // (`getUsers_()` อ่านทั้งชีท Users ทุกครั้ง แต่ไม่ได้ใช้ที่หน้าแดชบอร์ดหลักเลย)
                    // มาให้แล้ว — โหลดตรงนี้แทน ทุกครั้งที่เปิดแท็บ (เหมือน showTrend ด้านล่าง) เพื่อให้
                    // รายชื่อ user สดใหม่เสมอ ไม่ใช่โหลดครั้งเดียวค้างไว้ (sheetLinks ยังมากับ bootstrap
                    // ตามเดิม เพราะปุ่ม "เปิด Google Sheet" ใช้ตรงในหน้าแดชบอร์ดหลัก ไม่ใช่แค่แท็บนี้)
                    if (val === 'users' && this.session && this.session.role === 'admin') {
                        this.loadUsers();
                    }
                },
                showTrend(val) {
                    if (val) this.loadTrend();
                },
                provinceFilter() {
                    this.siteFilter = '';
                    this.renderProvinceChart();
                },
                siteFilter() {
                    this.renderProvinceChart();
                },
                provinceViewMetric() {
                    this.renderProvinceChart();
                },
            },
        }).mount('#app');
    </script>
</body>
</html>
